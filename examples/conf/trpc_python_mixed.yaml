global:                                           # Global config
  namespace: Development                          # Environment type: production or development
  env_name: test                                  # Environment name used outside production
  container_name:                                 # Container name
  local_ip:                                       # Host IP

# Mixed-protocol example: one process runs services of two protocols
#   - Greeter1: protocol: http_mcp  -> MCP service (trpc-mcp FastMCP/SSE transport)
#   - Greeter2: protocol: http      -> plain trpc HTTP service (aiohttp, handled by @routes.route)
# Shows that the http_mcp codec is isolated and does not affect a plain http service.
server:                                           # Server config
  app: test                                       # Application name
  server: mcp                                     # Process server name
  bin_path: /usr/local/trpc/bin/
  conf_path: /usr/local/trpc/conf/
  data_path: /usr/local/trpc/data/
  filter:
    - default
  service:
    - name: trpc.test.mcp.Greeter1               # MCP service
      ip: 127.0.0.1
      port: 8008
      network: tcp
      protocol: http_mcp                         # Application protocol: MCP
      timeout: 1000000
    - name: trpc.test.mcp.Greeter2               # Plain HTTP service
      ip: 127.0.0.1
      port: 8009
      network: tcp
      protocol: http                             # Application protocol: plain http
      timeout: 1000000

client:                                           # Client backend config
  timeout: 1000000
  namespace: Development
  filter:
    - default
  service:
    - name: trpc.test.mcp.Greeter1               # MCP backend, called by McpProxy
      target: ip://127.0.0.1:8008
      network: tcp
      timeout: 1000000
      protocol: http_mcp
    - name: trpc.test.mcp.Greeter2               # Plain HTTP backend, called by the trpc HTTP client
      target: ip://127.0.0.1:8009
      network: tcp
      timeout: 1000000
      protocol: http

plugins:                                         # Plugin config
  log:
    default:
      - writer: console
        level: debug
      - writer: file
        level: info
        formatter: json
        writer_config:
          filename: ./trpc.log
          max_size: 10
          max_backups: 10
          max_age: 7
          compress: false
  mcp:
    client:                                      # Applies only to McpProxy on http_mcp
      transport: sse
      base_url: /test
    server:                                      # Applies only to Greeter1 on http_mcp
      instructions: test1
      transport: sse
      base_url: /test
      settings:
        message_path: /messages/
