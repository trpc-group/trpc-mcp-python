global:                                           # Global config
  namespace: Development                          # Environment type: production or development
  env_name: test                                  # Environment name used outside production
  container_name:                                 # Container name
  local_ip:                                       # Host IP
  # Merge multiprocess model: handle_num workers. Each binds every port with SO_REUSEPORT
  # and runs its own uvicorn thread and MCP app.
  # Multiprocess SSE requires redis, and streamable-http requires stateless_http: true.
  # Otherwise trpc-mcp drops the process count to 1 and logs a warning.
  processmodel:
    mode: multi_process
    io_handle_type: merge
    handle_num: 2                                 # worker count; 0 means the CPU count

server:                                           # Server config
  app: test                                       # Application name
  server: mcp                                     # Process server name
  bin_path: /usr/local/trpc/bin/                  # Path to binaries and framework config
  conf_path: /usr/local/trpc/conf/                # Path to business config
  data_path: /usr/local/trpc/data/                # Path to business data
  filter:
    - default
  service:                                        # Services exposed by this process; more than one is allowed
    - name: trpc.test.mcp.Greeter1                # Service route name
      ip: 127.0.0.1                               # Listen IP
      port: 8008                                  # Listen port
      network: tcp                                # Network type: tcp or udp
      protocol: http_mcp                          # Application protocol
      timeout: 1000000                            # Max request time, in milliseconds
    - name: trpc.test.mcp.Greeter2                # Service route name
      ip: 127.0.0.1                               # Listen IP
      port: 8009                                  # Listen port
      network: tcp                                # Network type: tcp or udp
      protocol: http_mcp                          # Application protocol
      timeout: 1000000                            # Max request time, in milliseconds

client:                                           # Client backend config
  timeout: 1000000                                # Max request time for every backend
  namespace: Development                          # Namespace for every backend
  filter:
    - default
  service:                                        # Per-backend config (McpProxy loads it by name)
    - name: trpc.test.mcp.Greeter1                # Backend service name
      target: ip://127.0.0.1:8008                 # Backend address
      network: tcp                                # Backend network type: tcp or udp; this config wins
      timeout: 1000000                            # Max request time
      protocol: http_mcp                          # Application protocol
    - name: trpc.test.mcp.Greeter2                # Backend service name
      target: ip://127.0.0.1:8009                 # Backend address
      network: tcp                                # Backend network type: tcp or udp; this config wins
      timeout: 1000000                            # Max request time
      protocol: http_mcp                          # Application protocol


plugins:                                          # Plugin config
  log:                                            # Log config
    default:                                      # Default logger; multiple writers are allowed
      - writer: console                           # Console stdout, the default writer
        level: debug                              # Console log level
  mcp:
    client:                                       # MCP client config loaded by the McpProxy examples
      transport: sse                              # Default transport: sse or streamable-http
      base_url: /test                             # Server base_url prefix (same as server.base_url)
    server:
      instructions: test1
      transport: sse
      base_url: /test
      settings:
        message_path: /messages/
        stateless_http: true                      # multiprocess mode must be stateless
      redis:                                      # cross-process SSE session sync for multiprocess mode
        host: 127.0.0.1
        port: 6379
        db: 0
