[build-system]
requires = ["setuptools>=64.0", "wheel", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "trpc_mcp/version.py"

[project]
name = "trpc-mcp"
dynamic = ["version"]
description = "TRPC MCP implementation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "tRPC Group"}
]
keywords = ["trpc", "mcp", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "trpc-python",
    "mcp>=1.11.0,<2",
    "redis",
    "uvicorn",
]

[project.urls]
Documentation = ""
Repository = ""

# Include non-code files such as data and templates when needed.
[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.yml", "*.yaml"]

# Optional tool configuration.
[tool.black]
line-length = 120
target-version = ['py310']
exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | venv
  | env
  | node_modules
)/
'''

[tool.yapf]
based_on_style = "pep8"
column_limit = 120
indent_width = 4
split_before_logical_operator = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
